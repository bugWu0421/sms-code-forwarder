name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 镜像已预装 Android SDK，无需 setup-android
      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "SmsCodeForwarder-${GITHUB_REF_NAME}.apk"
          if gh release view "${GITHUB_REF_NAME}"; then
            gh release delete-asset "${GITHUB_REF_NAME}" app-debug.apk -y || true
            gh release upload "${GITHUB_REF_NAME}" "SmsCodeForwarder-${GITHUB_REF_NAME}.apk" --clobber
            gh release edit "${GITHUB_REF_NAME}" --draft=false --notes-file .github/release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" \
              "SmsCodeForwarder-${GITHUB_REF_NAME}.apk" \
              --title "${GITHUB_REF_NAME}" \
              --notes-file .github/release-notes.md
          fi
